version = 1
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
reasoning_effort = "medium"
timeout_seconds = 120

[[profiles]]
name = "cheap"
model = "gpt-5.6-luna"
escalate = false
confidence_threshold = 0.65

[[profiles]]
name = "cheap-plus-escalation"
model = "gpt-5.6-luna"
fallback_model = "gpt-5.6-terra"
escalate = true
confidence_threshold = 0.65

[[profiles]]
name = "stronger"
model = "gpt-5.6-terra"
escalate = false
confidence_threshold = 0.65
